version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major upgrades (React, TypeScript, ESLint, ...) are done deliberately, not by bot.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 7.1+ adds stricter React-Compiler rules (75 warnings + 1 error vs our limit of 36).
      # Remove this entry when tasks/todo/07-lint-warnings.md is done.
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
